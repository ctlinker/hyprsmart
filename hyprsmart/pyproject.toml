[project]
name = "hyprsmart"
version = "0.8.6"
description = "Adaptive intelligence and dynamic window transparency for Hyprland"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "ctlinker", email = "166874035+ctlinker@users.noreply.github.com" }]
dependencies = [
  "numpy>=2.5.3",
  "pillow>=12.3.0",
  "pyyaml>=6.0.3",
]

[project.scripts]
hyprsmart = "hyprsmart:main"

[dependency-groups]
dev = [
  "nuitka>=4.3",
  "pyinstaller>=6.22.3",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
